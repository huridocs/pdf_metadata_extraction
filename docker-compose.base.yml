services:
  pdf_metadata_extraction_api:
    container_name: pdf_metadata_extraction_api
    entrypoint: [ "gunicorn", "-k", "uvicorn.workers.UvicornWorker", "--workers", "1", "--chdir", "./src", "drivers.rest.app:app", "--bind", "0.0.0.0:5056", "--timeout", "300"  ]
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - data:/app/models_data
    depends_on:
      postgres_metadata_extraction:
        condition: service_healthy
      redis_metadata_extraction:
        condition: service_started
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN=${SENTRY_DSN:-}
    ports:
      - "5056:5056"
    env_file: .env
    network_mode: host
  pdf_metadata_extraction_queue_processor:
    container_name: pdf_metadata_extraction_queue_processor
    init: true
    entrypoint: [ "python", "-m", "src.drivers.queues_processor.start_queue_processor" ]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - data:/app/models_data
    depends_on:
      postgres_metadata_extraction:
        condition: service_healthy
      redis_metadata_extraction:
        condition: service_started
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NO_GPU=true
    network_mode: host
    env_file: .env
  postgres_metadata_extraction:
    restart: unless-stopped
    image: "postgres:16-alpine"
    network_mode: host
    command: ["postgres", "-p", "25018"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pdf_metadata_extraction
    ports:
      - "25018:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 25018 -U postgres -d pdf_metadata_extraction"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis_metadata_extraction:
    restart: unless-stopped
    image: "redis:7.2.5"
    command: redis-server
    environment:
      - REDIS_REPLICATION_MODE=master
    network_mode: host
    ports:
      - "6379:6379"
  redis_commander:
    container_name: redis_commander
    image: "rediscommander/redis-commander:latest"
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis_metadata_extraction:6379
    ports:
      - "8081:8081"
    network_mode: host
volumes:
  data:
  postgres_data:

